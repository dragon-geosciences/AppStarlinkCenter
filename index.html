<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>Dragon Starlink Dashboard</title>

    <style>
        :root {
            --dragon-blue: #0f2a60;
            --footer-cover-height: 36px;
        }

        * {
            box-sizing: border-box;
        }

        html,
        body {
            width: 100%;
            height: 100%;
            margin: 0;
            padding: 0;
            font-family: Arial, sans-serif;
            background-color: var(--dragon-blue);
            overflow: hidden;
        }

        /* 登入畫面 */
        #loginOverlay {
            position: fixed;
            inset: 0;
            z-index: 9999;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 16px;
            background-color: var(--dragon-blue);
        }

        #loginBox {
            width: 320px;
            max-width: 100%;
            padding: 32px;
            background-color: #fff;
            border-radius: 12px;
            text-align: center;
            box-shadow: 0 8px 30px rgba(0, 0, 0, 0.35);
        }

        #loginBox h2 {
            margin: 0 0 10px;
            color: var(--dragon-blue);
            font-size: 22px;
        }

        #loginBox p {
            margin: 0 0 20px;
            color: #555;
            font-size: 14px;
        }

        #passwordInput {
            width: 100%;
            padding: 12px;
            border: 1px solid #aaa;
            border-radius: 6px;
            font-size: 16px;
            outline: none;
        }

        #passwordInput:focus {
            border-color: var(--dragon-blue);
        }

        #loginButton {
            width: 100%;
            margin-top: 15px;
            padding: 12px;
            border: none;
            border-radius: 6px;
            background-color: var(--dragon-blue);
            color: #fff;
            font-size: 16px;
            cursor: pointer;
        }

        #loginButton:hover {
            background-color: #173b82;
        }

        #loginButton:disabled {
            opacity: 0.65;
            cursor: wait;
        }

        #errorMessage {
            min-height: 20px;
            margin-top: 12px;
            color: #c62828;
            font-size: 14px;
        }

        /*
         * 登入後的主畫面：iframe 滿版，底部工具列直接覆蓋 iframe。
         * Power BI 原生的灰色 Microsoft Power BI / 分享工具列。
         */
        #mainContent {
            display: none;
            position: relative;
            width: 100%;
            height: 100vh;
            height: 100dvh;
            overflow: hidden;
        }

        #iframeContainer {
            position: absolute;
            inset: 0;
            padding: 8px 8px 0;
            overflow: hidden;
        }

        #myIframe {
            display: block;
            width: 100%;
            height: 100%;
            border: none;
            background-color: #fff;
        }

        /*
         * 藍色工具列覆蓋 iframe 最下方。
         * 高度約 36px（貼近原始版本），不要蓋住它上方的
         * Power BI 縮放控制列（－、滑桿、＋、百分比、全螢幕）。
         * 如果 Power BI 日後改變工具列尺寸，只需調整 --footer-cover-height。
         */
        #bottomToolbar {
            position: absolute;
            right: 0;
            bottom: 0;
            left: 0;
            z-index: 10;
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 8px;
            height: calc(var(--footer-cover-height) + env(safe-area-inset-bottom));
            padding: 4px 10px calc(4px + env(safe-area-inset-bottom));
            background-color: var(--dragon-blue);
        }

        .toolbarGroup {
            display: flex;
            align-items: center;
            gap: 8px;
            white-space: nowrap;
        }

        .toolbarButton {
            height: 28px;
            min-height: 28px;
            padding: 3px 10px;
            border: 1px solid rgba(255, 255, 255, 0.45);
            border-radius: 7px;
            background: transparent;
            color: #fff;
            font-size: 13px;
            line-height: 20px;
            font-weight: 600;
            cursor: pointer;
        }

        .toolbarButton:hover {
            background-color: #20447f;
        }

        .modeButton[aria-pressed="true"] {
            background-color: #fff;
            border-color: #fff;
            color: var(--dragon-blue);
        }

        .modeButton[aria-pressed="true"]:hover {
            background-color: #eef2f8;
        }

        .toolbarButton:focus-visible,
        #loginButton:focus-visible {
            outline: 2px solid #72b9ff;
            outline-offset: 2px;
        }

        /* 小螢幕縮小底部按鈕，避免擠在一起 */
        @media (max-width: 480px) {
            #bottomToolbar {
                gap: 4px;
                padding-right: 7px;
                padding-left: 7px;
            }

            .toolbarGroup {
                gap: 4px;
            }

            .toolbarButton {
                padding: 3px 7px;
                font-size: 12px;
            }

            #iframeContainer {
                padding: 5px 5px 0;
            }
        }
    </style>
</head>

<body>
    <!-- 統一的密碼登入畫面 -->
    <div id="loginOverlay">
        <form id="loginBox">
            <h2>Dragon Starlink Dashboard</h2>
            <p>Please enter the password to continue.</p>
            <input
                type="password"
                id="passwordInput"
                placeholder="Password"
                autocomplete="current-password"
                aria-label="Password"
            >
            <button id="loginButton" type="submit">Login</button>
            <div id="errorMessage" role="alert"></div>
        </form>
    </div>

    <!-- 登入後載入報表；藍色工具列僅遮住 Power BI 品牌／分享列，保留上方縮放列 -->
    <main id="mainContent">
        <div id="iframeContainer">
            <iframe
                id="myIframe"
                title="Dragon Starlink Power BI Report"
                allowfullscreen
            ></iframe>
        </div>

        <footer id="bottomToolbar">
            <div class="toolbarGroup" aria-label="Report view">
                <button type="button" id="mobileButton" class="toolbarButton modeButton" aria-pressed="false">Mobile</button>
                <button type="button" id="desktopButton" class="toolbarButton modeButton" aria-pressed="false">Desktop</button>
            </div>
            <div class="toolbarGroup">
                <button type="button" id="refreshButton" class="toolbarButton">Refresh ⟳</button>
                <button type="button" id="logoutButton" class="toolbarButton">Logout</button>
            </div>
        </footer>
    </main>

    <script>
        // 頁面右鍵及常見快捷鍵攔截：僅介面便利設定，不是安全控制。
        document.addEventListener("contextmenu", function(event) {
            event.preventDefault();
        });

        document.addEventListener("keydown", function(event) {
            const key = event.key.toLowerCase();
            const ctrl = event.ctrlKey;
            const shift = event.shiftKey;
            const alt = event.altKey;
            const blockF12 = key === "f12" || event.keyCode === 123;
            const blockSourceOrSave = ctrl && !shift && !alt && (key === "u" || key === "s");
            const blockDevTools = ctrl && shift && !alt && (key === "i" || key === "j" || key === "c");
            if (blockF12 || blockSourceOrSave || blockDevTools) {
                event.preventDefault();
                event.stopPropagation();
            }
        }, true);

        // 唯一公開的服務網址。真正的 Power Automate HTTP URL 存在 Worker Secret。
        const authApiUrl = "https://dragon-starlink-auth.myprincessmononoke.workers.dev/";

        // 同一個瀏覽器登入記憶 90 天；只快取公司與報表網址，絕不保存明文密碼。
        // 這是前端登入記憶，而非可由後端撤銷/驗證的安全登入憑證。
        const sessionKey = "dragonStarlinkCenterSessionV1";
        const modeKey = "dragonStarlinkDisplayMode";
        const sessionDurationMs = 90 * 24 * 60 * 60 * 1000;
        const mobileMedia = window.matchMedia("(max-width: 767px)");

        const loginOverlay = document.getElementById("loginOverlay");
        const loginBox = document.getElementById("loginBox");
        const loginButton = document.getElementById("loginButton");
        const mainContent = document.getElementById("mainContent");
        const passwordInput = document.getElementById("passwordInput");
        const errorMessage = document.getElementById("errorMessage");
        const iframe = document.getElementById("myIframe");
        const mobileButton = document.getElementById("mobileButton");
        const desktopButton = document.getElementById("desktopButton");

        let reportUrls = { mobile: "", desktop: "" };
        let company = "";
        let currentMode = null;
        let authenticated = false;

        function validHttpsUrl(input) {
            if (typeof input !== "string" || !input.trim()) return "";
            try {
                const parsed = new URL(input.trim());
                return parsed.protocol === "https:" ? parsed.href : "";
            } catch (_) {
                return "";
            }
        }

        // 容錯：若公司只有一種版型，兩個按鈕都可以正常開啟該報表。
        function parseReportMapping(data) {
            if (!data || data.success !== true || typeof data.company !== "string" || !data.company.trim()) {
                return null;
            }
            const mobile = validHttpsUrl(data.mobileUrl);
            const desktop = validHttpsUrl(data.desktopUrl);
            if (!mobile && !desktop) return null;
            return {
                company: data.company.trim(),
                mobileUrl: mobile || desktop,
                desktopUrl: desktop || mobile
            };
        }

        function clearStoredSession() {
            try { localStorage.removeItem(sessionKey); } catch (_) {}
        }

        function saveSession(mapping) {
            const data = {
                ...mapping,
                expiresAt: Date.now() + sessionDurationMs
            };
            try { localStorage.setItem(sessionKey, JSON.stringify(data)); } catch (_) {
                // 瀏覽器可能封鎖儲存；這種情況下本分頁仍可使用。
            }
        }

        function restoreSession() {
            try {
                const raw = localStorage.getItem(sessionKey);
                if (!raw) return null;
                const saved = JSON.parse(raw);
                if (typeof saved.expiresAt !== "number" || Date.now() >= saved.expiresAt) {
                    clearStoredSession();
                    return null;
                }
                const mapping = parseReportMapping({ ...saved, success: true });
                if (!mapping) clearStoredSession();
                return mapping;
            } catch (_) {
                clearStoredSession();
                return null;
            }
        }

        function detectDisplayMode() {
            return mobileMedia.matches ? "mobile" : "desktop";
        }

        function setDisplayMode(mode, manual = false) {
            if (!authenticated || !Object.prototype.hasOwnProperty.call(reportUrls, mode)) return;
            if (manual) {
                try { sessionStorage.setItem(modeKey, mode); } catch (_) {}
            }
            currentMode = mode;
            mobileButton.setAttribute("aria-pressed", String(mode === "mobile"));
            desktopButton.setAttribute("aria-pressed", String(mode === "desktop"));
            if (iframe.getAttribute("src") !== reportUrls[mode]) {
                iframe.src = reportUrls[mode];
            }
        }

        function showMainContent(mapping) {
            company = mapping.company;
            reportUrls = { mobile: mapping.mobileUrl, desktop: mapping.desktopUrl };
            authenticated = true;
            iframe.title = company + " Starlink Power BI Report";
            loginOverlay.style.display = "none";
            mainContent.style.display = "block";

            let savedMode = null;
            try { savedMode = sessionStorage.getItem(modeKey); } catch (_) {}
            const mode = savedMode === "mobile" || savedMode === "desktop"
                ? savedMode : detectDisplayMode();
            setDisplayMode(mode);
        }

        // 密碼僅在首次登入時送往 Cloudflare Worker -> Power Automate -> OneDrive Excel。
        loginBox.addEventListener("submit", async function(event) {
            event.preventDefault();
            if (loginButton.disabled) return;
            const password = passwordInput.value;
            if (!password) {
                errorMessage.textContent = "Please enter the password.";
                passwordInput.focus();
                return;
            }

            loginButton.disabled = true;
            loginButton.textContent = "Signing in...";
            errorMessage.textContent = "";
            const controller = new AbortController();
            const timeout = setTimeout(() => controller.abort(), 25000);
            try {
                const response = await fetch(authApiUrl, {
                    method: "POST",
                    headers: { "Content-Type": "application/json" },
                    body: JSON.stringify({ password }),
                    signal: controller.signal,
                    cache: "no-store"
                });

                if (response.status === 401) {
                    errorMessage.textContent = "Incorrect password. Please try again.";
                    passwordInput.value = "";
                    passwordInput.focus();
                    return;
                }
                if (!response.ok) {
                    throw new Error("Authentication service unavailable (HTTP " + response.status + ").");
                }
                const result = await response.json();
                const mapping = parseReportMapping(result);
                if (!mapping) {
                    throw new Error("Invalid company or report URL returned by the service.");
                }
                saveSession(mapping);
                passwordInput.value = "";
                showMainContent(mapping);
            } catch (error) {
                errorMessage.textContent = error.name === "AbortError"
                    ? "Connection timed out. Please try again."
                    : "Sign-in failed. Please try again later.";
            } finally {
                clearTimeout(timeout);
                loginButton.disabled = false;
                loginButton.textContent = "Login";
            }
        });

        mobileButton.addEventListener("click", function() {
            setDisplayMode("mobile", true);
        });
        desktopButton.addEventListener("click", function() {
            setDisplayMode("desktop", true);
        });

        document.getElementById("refreshButton").addEventListener("click", function() {
            if (authenticated && currentMode) {
                iframe.src = reportUrls[currentMode];
            }
        });

        // 登出清除 90 天記憶與本分頁顯示模式。
        document.getElementById("logoutButton").addEventListener("click", function() {
            clearStoredSession();
            try { sessionStorage.removeItem(modeKey); } catch (_) {}
            mainContent.style.display = "none";
            iframe.src = "about:blank";
            authenticated = false;
            currentMode = null;
            company = "";
            reportUrls = { mobile: "", desktop: "" };
            loginOverlay.style.display = "flex";
            passwordInput.value = "";
            errorMessage.textContent = "";
            passwordInput.focus();
        });

        // 當使用者未手動選擇版型時，手機旋轉或視窗尺寸變更會自動切換。
        function handleScreenChange() {
            let savedMode = null;
            try { savedMode = sessionStorage.getItem(modeKey); } catch (_) {}
            if (authenticated && !savedMode) setDisplayMode(detectDisplayMode());
        }
        if (typeof mobileMedia.addEventListener === "function") {
            mobileMedia.addEventListener("change", handleScreenChange);
        } else {
            mobileMedia.addListener(handleScreenChange);
        }

        // 重新開啟同一瀏覽器時，如 90 天內有快取資料，便可直接顯示上次的報表。
        const savedMapping = restoreSession();
        if (savedMapping) {
            showMainContent(savedMapping);
        } else {
            passwordInput.focus();
        }
    </script>
</body>
</html>
